<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hourlit Status</title>
<style>
:root{--bg:#0b0d12;--fg:#e8eaf0;--muted:#9aa3b2;--ok:#2fbf71;--card:#141823}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:48px 16px}
h1{font-size:22px;margin:0 0 24px}
.card{background:var(--card);border-radius:12px;padding:20px 22px;display:flex;align-items:center;gap:12px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--ok)}
p{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
<h1>Hourlit Status</h1>
<div class="card"><span class="dot"></span><strong>All systems operational</strong></div>
<p>Incidents and maintenance notices are posted here. Also available at hourlit.github.io/hourlit-status.</p>
</main>
</body>
</html>
